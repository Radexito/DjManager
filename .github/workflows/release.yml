name: Build & Release

on:
  push:
    branches: [main, staging]

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release metadata
        id: meta
        run: |
          LAST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sed -E 's/^v//; s/-.*//' | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            MAJOR=1; MINOR=0; PATCH=0
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LAST_TAG"
          fi
          if [ "${{ github.ref_name }}" == "main" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
            PRERELEASE=false
          else
            PATCH=$((PATCH + 1))
            PRERELEASE=true
          fi
          VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="v${VERSION}-${GITHUB_SHA::7}"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install renderer dependencies
        run: cd renderer && npm ci --legacy-peer-deps

      - name: Cache electron-builder tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Build renderer
        run: npm run build-renderer

      - name: Stamp version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '${{ needs.setup.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Build Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
          if-no-files-found: warn

  create-release:
    needs: [setup, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Create ${{ github.ref_name == 'staging' && 'pre-release' || 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: 'DJ Manager ${{ needs.setup.outputs.version }}'
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.setup.outputs.prerelease != 'true' }}
          body: |
            ${{ github.ref_name == 'staging' && '> ⚠️ Pre-release build from `staging` — may be unstable.' || '✅ Stable release from `main`.' }}

            **Commit:** ${{ github.sha }}
            ${{ github.event.head_commit.message }}

            | File | Platform |
            |------|----------|
            | `*-Linux.AppImage` | Linux x86_64 |
            | `*.dmg`            | macOS Apple Silicon |
            | `*-win-setup.exe`  | Windows x86_64 |
          files: dist/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-version:
    if: github.ref_name == 'main'
    needs: [create-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -m "chore: sync main → dev after release [skip ci]"

      - name: Bump patch version in package.json
        run: |
          OLD=$(node -e "console.log(require('./package.json').version)")
          NEW=$(node -e "const v='$OLD'.split('.'); v[2]=String(Number(v[2])+1); console.log(v.join('.'))")
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Bumped $OLD -> $NEW"

      - name: Commit and push to dev
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          git add package.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin dev
